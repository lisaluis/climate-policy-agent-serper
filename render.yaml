services:
  - type: web
    name: climate-policy-agent-serper-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERPER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
